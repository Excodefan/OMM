aboutTitle: "A technical foundation. A broader perspective."
aboutText: |-
  My professional journey has taken me from software development and systems analysis to IT management, executive leadership and project delivery, across Romania, Canada and the United States.

  Today, my work focuses on the technical assessment of EU-funded projects with IT components, while I continue exploring practical applications of artificial intelligence and automation.

  Throughout this journey, one idea has remained constant: technology creates value when it connects people, processes and business needs.
aboutCta: "More About Me"
writingTitle: "Ideas worth exploring."
writingText: |-
  Technology evolves quickly. Understanding how it is applied — and where it actually makes a difference — matters more than simply following the latest developments.

  Here I share selected articles, research and practical examples of AI adoption across industries, with links to original sources and my own observations.

  From healthcare and education to energy, business and public services, the focus is on real-world applications, opportunities and lessons learned.
