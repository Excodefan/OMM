heroTitle: "Tehnologia este doar o parte a poveștii."
heroText: "Decenii de experiență în dezvoltare software, proiecte și management. Un interes constant pentru modul în care tehnologia poate crea valoare concretă."
heroPrimary: "Descoperă experiența profesională"
heroSecondary: "Despre mine"
aboutTitle: "O bază tehnică solidă. O perspectivă mai largă."
aboutText: |-
  Parcursul meu profesional m-a purtat de la dezvoltarea software și analiza sistemelor informatice către management IT, conducere executivă și coordonarea proiectelor, în România, Canada și Statele Unite.

  În prezent, activitatea mea se concentrează pe evaluarea tehnică a proiectelor finanțate din fonduri europene, cu componentă IT, în paralel cu explorarea aplicațiilor practice ale inteligenței artificiale și automatizării.

  De-a lungul acestei experiențe, o idee a rămas constantă: tehnologia creează valoare atunci când conectează oameni, procese și nevoi de business.
aboutCta: "Mai multe despre mine"
writingTitle: "Idei care merită explorate."
writingText: |-
  Tehnologia evoluează rapid. Mai important decât să urmărim fiecare noutate este să înțelegem cum poate fi aplicată și unde produce rezultate concrete.

  Aici reunesc articole selectate, studii și exemple practice de utilizare a inteligenței artificiale în diferite domenii, cu trimiteri la sursele originale și observații proprii.

  De la sănătate și educație la energie, business și servicii publice, accentul este pus pe aplicații reale, oportunități și lecții învățate.
writingCta: "Explorează articolele selectate"
projectsTitle: "Proiecte și experimente"
projectsText: |-
  Un spațiu dedicat instrumentelor practice, proiectelor de automatizare și experimentelor cu tehnologii emergente.

  În prezent, analizez și organizez proiectele pe care doresc să le prezint.
projectsNote: "În curs de pregătire. Mai multe în curând."
contactTitle: "Să ținem legătura."
contactText: "Sunt întotdeauna interesat de discuții constructive despre tehnologie, managementul proiectelor, transformare digitală și utilizarea practică a AI."
contactCta: "Contactează-mă"
