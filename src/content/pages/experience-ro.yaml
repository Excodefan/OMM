title: "Experiență"
intro: "Un parcurs profesional ușor de urmărit, completat de scurte animații Career Stories."
items:
  - role: "Expert IT"
    organization: "Ministerul Investițiilor și Proiectelor Europene"
    period: "Septembrie 2024 – prezent"
    location: "București"
    text: |-
      Activitatea mea se concentrează pe evaluarea tehnică și monitorizarea proiectelor finanțate din fonduri europene, cu accent pe dezvoltarea software, integrarea sistemelor informatice și implementarea componentelor IT.

      Analizez documentația tehnică, rapoartele de progres și livrabilele proiectelor, urmărind coerența activităților raportate și a informațiilor justificative din perspectivă IT.

      Această activitate îmbină analiza tehnică și cunoașterea procedurilor și sistemelor de raportare specifice finanțărilor europene, inclusiv MySMIS și platforma PNRR.

      În paralel, dezvolt instrumente Python și JavaScript pentru eficientizarea prelucrării datelor, raportării și activităților repetitive. Explorez și utilizarea practică a instrumentelor AI cloud și locale pentru analiza documentelor și procesarea informațiilor, acordând atenție confidențialității și protecției datelor.
    areas:
      - "Evaluare tehnică IT"
      - "Proiecte cu finanțare europeană"
      - "Software și integrarea sistemelor"
      - "Automatizarea proceselor"
      - "AI aplicat"
    story: mipe
  - role: "Consultant senior de management / Manager de proiect"
    organization: "Distribuție Energie Electrică România — Grupul Electrica"
    period: "Iulie 2023 – septembrie 2024"
    location: "București"
    text: |-
      Am desfășurat activități de consultanță pentru management în cadrul unor inițiative strategice de tehnologie și infrastructură din sectorul distribuției energiei electrice.

      Un domeniu important de implicare a fost implementarea unei soluții TIBCO Enterprise Service Bus (ESB), destinată integrării aplicațiilor informatice ale companiei, inclusiv MDM, WFM, AMS, SCADA, OMS și SAP IS-U.

      Ca membru al echipei de management al proiectului, am participat la coordonarea colaborării dintre specialiștii interni, furnizorii externi și factorii implicați, cu atenție la cerințele tehnice, dependențele dintre activități, riscuri și livrabile.

      Această experiență mi-a consolidat perspectiva asupra integrării sistemelor enterprise și a relației dintre arhitectura tehnologică, procesele operaționale și managementul proiectelor în sectorul energetic.
    areas:
      - "Managementul proiectelor"
      - "Integrarea sistemelor enterprise"
      - "TIBCO ESB"
      - "Distribuția energiei"
      - "Coordonarea echipelor și partenerilor"
    story: deer
  - role: "Consultant senior de management / Manager de proiect"
    organization: "Electrica Furnizare SA — Grupul Electrica"
    period: "Decembrie 2019 – iulie 2023"
    location: "București"
    text: |-
      Am desfășurat activități de consultanță pentru management în proiecte de modernizare tehnologică, transformare organizațională și coordonare IT, în sectorul furnizării energiei electrice.

      Una dintre responsabilitățile principale a fost coordonarea implementării cerințelor de securitate cibernetică prevăzute de Directiva europeană NIS 1. Activitatea a inclus elaborarea și implementarea politicilor, procedurilor și măsurilor organizaționale aplicabile operatorilor de servicii esențiale. Implementarea a făcut obiectul unor audituri efectuate de Directoratul Național de Securitate Cibernetică (DNSC), încheiate cu rezultate favorabile.

      Am participat, de asemenea, la planificarea și coordonarea activităților de integrare și tranziție a sistemelor informatice enterprise, în contextul proiectelor SAP IS-U și SAP S/4HANA.

      Activitatea a presupus colaborarea cu echipe de management, tehnice și operaționale, urmărirea activităților, riscurilor și dependențelor dintre proiecte, precum și corelarea inițiativelor tehnologice cu prioritățile organizației.
    areas:
      - "Consultanță de management"
      - "Implementarea NIS 1"
      - "Guvernanța securității cibernetice"
      - "Integrare SAP"
      - "Managementul proiectelor"
      - "Transformare organizațională"
    story: electrica
  - role: "Manager de proiect"
    organization: "Expert Computers"
    period: "Iulie 2018 – iulie 2019"
    location: "London, Ontario, Canada"
    text: |-
      Am gestionat proiecte IT de adoptare a soluțiilor cloud și modernizare a infrastructurii informatice, inclusiv migrarea utilizatorilor de la Microsoft Exchange 2016 la Office 365 și inițiative de implementare a soluțiilor Microsoft Azure.

      Responsabilitățile mele au inclus planificarea proiectelor, coordonarea echipelor tehnice, colaborarea cu beneficiarii și specialiștii în soluții, precum și urmărirea termenelor, riscurilor și etapelor de implementare.

      Am contribuit, de asemenea, la pregătirea propunerilor de proiect și a documentelor de definire a serviciilor, urmărind corelarea cerințelor tehnice cu așteptările clienților și planurile de livrare.

      Această experiență mi-a consolidat practica managementului de proiect, prin îmbinarea planificării structurate cu managementul relațiilor cu părțile implicate și coordonarea implementărilor tehnice.
    areas:
      - "Managementul proiectelor"
      - "Migrare cloud"
      - "Microsoft 365"
      - "Azure"
      - "Relația cu beneficiarii"
      - "Livrarea proiectelor"
    story: expert
  - role: "Director general / Manager de proiect"
    organization: "Arhivio Data"
    period: "Iulie 2016 – iunie 2018"
    location: "București"
    text: |-
      Am îmbinat responsabilitățile de conducere a companiei cu managementul efectiv al proiectelor de dezvoltare software, în special al soluțiilor de gestionare a conținutului (CMS) și comerț electronic.

      Activitatea mea a inclus coordonarea definirii cerințelor de business și tehnice, organizarea etapelor de analiză și proiectare a sistemelor, stabilirea livrabilelor și gestionarea colaborării cu specialiștii tehnici și consultanții externi.

      Am fost responsabil de planificarea proiectelor, alocarea responsabilităților, urmărirea progresului și gestionarea dependențelor, folosind abordări Agile și Waterfall în funcție de specificul proiectelor.

      Rolul a inclus și relația cu beneficiarii, identificarea oportunităților de business și explorarea posibilităților de finanțare europeană pentru proiecte IT.
    areas:
      - "Managementul proiectelor IT"
      - "Analiză de business"
      - "Dezvoltare software"
      - "CMS și comerț electronic"
      - "Coordonarea echipelor"
      - "Relația cu beneficiarii"
    story: arhivio
  - role: "Director general / Director"
    organization: "Teletrans SA"
    period: "Mai 2011 – iulie 2016"
    location: "București"
    text: |-
      Teletrans, filială a CNTEE Transelectrica, furniza soluții și servicii de telecomunicații, tehnologia informației și informatică de proces pentru sectorul energetic.

      Responsabilitățile mele au inclus conducerea executivă a societății și, ulterior, coordonarea activităților de strategie, programe, comunicare și relații internaționale.

      Activitatea a presupus coordonarea investițiilor IT și de telecomunicații, gestionarea portofoliului de proiecte și corelarea inițiativelor tehnologice cu prioritățile organizației.

      Printre proiectele reprezentative s-au numărat implementări SAP HCM și CRM, modernizarea sistemelor SCADA, infrastructura de fibră optică, dezvoltarea centrelor de date și soluțiile de recuperare în caz de dezastru.

      Am fost implicat, de asemenea, în explorarea oportunităților de accesare a fondurilor europene pentru proiecte tehnologice și de infrastructură, în contextul constrângerilor de reglementare și organizatorice existente la acea vreme.
    areas:
      - "Management executiv"
      - "Strategie IT"
      - "Guvernanța proiectelor"
      - "Telecomunicații"
      - "Sector energetic"
    story: teletrans
  - role: "Director general"
    organization: "Centrul Român pentru Promovarea Comerțului și Investițiilor Străine (CRPCIS) — Ministerul Economiei"
    period: "Septembrie 2009 – mai 2011"
    location: "București"
    text: |-
      Am fost numit la conducerea acestei instituții publice în considerarea experienței mele internaționale în domeniul tehnologiei informației, cu obiectivul de a contribui la promovarea expertizei IT românești pe piețele externe și la atragerea investițiilor străine în sectorul tehnologic.

      Rolul meu a îmbinat conducerea executivă cu dezvoltarea relațiilor economice internaționale, reprezentarea instituțională și promovarea competențelor românești pe piețele globale.

      În cadrul mandatului mai larg al instituției, dedicat promovării exporturilor și investițiilor străine, am urmărit și consolidarea poziționării sectorului IT românesc ca domeniu atractiv pentru parteneriate și investiții internaționale.

      Această experiență mi-a extins perspectiva asupra relației dintre tehnologie, dezvoltare economică, mediul de afaceri internațional și politicile publice.
    areas:
      - "Management executiv"
      - "Relații economice internaționale"
      - "Promovarea sectorului IT"
      - "Investiții străine"
      - "Conducere instituțională"
    story: crpcis
  - role: "Consilier IT&C / Manager de proiect"
    organization: "Primăria Municipiului Piatra Neamț"
    period: "Octombrie 2005 – septembrie 2009"
    location: "Piatra Neamț"
    text: |-
      Am coordonat departamentul IT al municipalității, raportând direct primarului, și am avut o contribuție importantă la modernizarea și digitalizarea administrației publice locale.

      Responsabilitățile mele au inclus elaborarea strategiilor IT, definirea priorităților tehnologice, coordonarea echipei de specialiști și a furnizorilor externi, precum și integrarea soluțiilor informatice în procesele administrative.

      Am coordonat și am participat la inițiative privind evaluarea infrastructurii IT, pregătirea implementării unui sistem ERP și implementarea unui sistem electronic de control al accesului pentru facilități sportive.

      Această experiență a reprezentat o etapă importantă în evoluția mea profesională, reunind pregătirea tehnică, responsabilitățile de conducere, managementul administrației publice și transformarea digitală.
    areas:
      - "Management IT"
      - "Digitalizarea administrației publice"
      - "Strategie IT"
      - "Managementul proiectelor"
      - "Transformare organizațională"
    story: piatra
  - role: "Analist de sisteme / Inginer software"
    organization: "SSI North America"
    period: "Iunie 1999 – iunie 2005"
    location: "Minneapolis, Minnesota, SUA"
    text: |-
      Am participat la proiecte de dezvoltare software și analiză de sisteme pentru beneficiari din administrația publică, energie, telecomunicații și transporturi.

      Activitatea tehnică a inclus utilizarea Java, Oracle PL/SQL, CORBA, arhitecturi distribuite și aplicații pe trei niveluri, precum și modelarea sistemelor și dezvoltarea în medii Unix și Linux.

      Dincolo de programare, responsabilitățile mele au inclus analiza cerințelor de business, coordonarea tehnică și interacțiunea directă cu beneficiarii, contribuind la transformarea nevoilor operaționale în soluții informatice.

      Această experiență a influențat semnificativ modul în care abordez tehnologia: nu doar ca activitate de dezvoltare software, ci și ca instrument pentru rezolvarea problemelor de business.
    areas:
      - "Dezvoltare software"
      - "Analiză de sisteme"
      - "Java"
      - "Oracle"
      - "Arhitecturi distribuite"
      - "Analiză de business"
    story: ssi
  - role: "Manager — Planificarea producției"
    organization: "Weber Marking Systems"
    period: "Ianuarie 1998 – iunie 1999"
    location: "Mississauga, Canada"
    text: |-
      Am coordonat activități de planificare a producției și logistică într-o companie specializată în soluții industriale de identificare și etichetare.

      Această poziție mi-a consolidat înțelegerea proceselor operaționale, planificării resurselor și relației practice dintre sistemele informatice și activitățile de business.
    areas:
      - "Planificarea producției"
      - "Logistică"
      - "Operațiuni"
      - "Procese de business"
    story: canada
  - role: "Analist programator"
    organization: "Sefrad Digital"
    period: "Mai 1996 – mai 1998"
    location: "Toronto, Canada"
    text: |-
      Am dezvoltat aplicații informatice pentru activități de business, utilizând Visual Basic, Microsoft Access și Crystal Reports.

      Această experiență mi-a permis să consolidez competențele practice de dezvoltare software, prin transformarea cerințelor operaționale în aplicații și soluții de raportare.
    areas:
      - "Visual Basic"
      - "Dezvoltare aplicații"
      - "Microsoft Access"
      - "Raportare"
    story: none
  - role: "Inginer / Suport tehnic pentru vânzări"
    organization: "Romforest SA"
    period: "Iunie 1993 – mai 1995"
    location: "Piatra Neamț"
    text: |-
      Prima etapă a activității mele profesionale a îmbinat pregătirea inginerească, suportul tehnic pentru vânzări și relația directă cu clienții.

      În această perioadă, interesul pentru informatică m-a determinat să învăț programare în mod autodidact, în special FoxPro și Visual Basic, pornind de la cunoștințele de Fortran dobândite în timpul facultății.

      Aceasta a fost etapa de început a unei tranziții treptate de la activitățile inginerești și comerciale către dezvoltarea software și tehnologia informației.
    areas:
      - "Inginerie"
      - "Vânzări tehnice"
      - "Relația cu clienții"
      - "Programare"
    story: early90s
