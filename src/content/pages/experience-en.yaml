  - role: "Engineer / Technical Sales Support"
    organization: "Romforest SA"
    period: "June 1993 – May 1995"
    location: "Piatra Neamț, Romania"
    text: |-
      My early professional experience combined engineering with technical sales support and direct interaction with customers.

      During this period, I developed a growing interest in software and began independently learning programming, particularly FoxPro and Visual Basic, building on my earlier exposure to Fortran during university.

      This was the starting point of a gradual transition from engineering and commercial activities towards software development and information technology.
    areas:
