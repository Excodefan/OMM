title: "Experience"
intro: "A readable professional timeline, complemented by short animated Career Stories."
items:
  - role: "IT Expert"
    organization: "Ministry of Investments and European Projects"
    period: "September 2024 – Present"
    location: "Bucharest, Romania"
    text: |-
      My work focuses on the technical assessment and monitoring of EU-funded projects, with particular attention to software development, system integration and IT implementation activities.

      I review technical documentation, progress reports and project deliverables to assess the consistency of reported activities and their supporting information from an IT perspective.

      The role combines technical analysis with an understanding of European funding procedures and reporting systems, including MySMIS and the PNRR platform.

      Alongside these responsibilities, I develop Python and JavaScript tools to streamline data processing, reporting and repetitive workflows. I also explore practical applications of cloud-based and local AI tools for document analysis and information processing, with attention to confidentiality and data protection.
    areas:
      - "Technical Assessment"
      - "EU-Funded Projects"
      - "Software & Systems Integration"
      - "Process Automation"
      - "Applied AI"
    story: mipe
  - role: "Senior Management Consultant / Project Manager"
    organization: "Distribuție Energie Electrică România — Electrica Group"
    period: "July 2023 – September 2024"
    location: "Bucharest, Romania"
    text: |-
      I provided management consultancy for strategic technology and infrastructure initiatives in the electricity distribution sector.

      A key area of involvement was the implementation of a TIBCO Enterprise Service Bus (ESB) solution, designed to support the integration of enterprise applications including MDM, WFM, AMS, SCADA, OMS and SAP IS-U.

      As part of the project management team, I contributed to coordinating internal specialists, external suppliers and stakeholders, with attention to technical requirements, dependencies, risks and project deliverables.

      This experience strengthened my understanding of enterprise integration and the relationship between technology architecture, operational processes and project management in the energy sector.
    areas:
      - "Project Management"
      - "Enterprise Integration"
      - "TIBCO ESB"
      - "Energy Distribution"
      - "Stakeholder Coordination"
    story: deer
  - role: "Senior Management Consultant / Project Manager"
    organization: "Electrica Furnizare SA — Electrica Group"
    period: "December 2019 – July 2023"
    location: "Bucharest, Romania"
    text: |-
      I provided senior management consultancy in technology modernization, organizational transformation and IT project coordination within the electricity supply sector.

      One of my key responsibilities was coordinating the implementation of the cybersecurity framework required under the EU's NIS 1 Directive. This involved developing and implementing organizational security policies, procedures and measures applicable to operators of essential services. The implementation was subject to audits conducted by Romania's National Cyber Security Directorate (DNSC), with positive outcomes.

      I also contributed to the planning and coordination of enterprise system integration and transition activities involving SAP IS-U and SAP S/4HANA.

      The role required collaboration across management, technical and operational teams, monitoring project activities, risks and dependencies, and supporting alignment between technology initiatives and business priorities.
    areas:
      - "Management Consulting"
      - "NIS 1 Implementation"
      - "Cybersecurity Governance"
      - "SAP Integration"
      - "Project Management"
      - "Organizational Transformation"
    story: electrica
  - role: "Project Manager"
    organization: "Expert Computers"
    period: "July 2018 – July 2019"
    location: "London, Ontario, Canada"
    text: |-
      I managed IT projects focused on cloud adoption and infrastructure modernization, including user migration from Microsoft Exchange 2016 to Office 365 and initiatives involving Microsoft Azure.

      My responsibilities covered project planning, coordination of technical teams, collaboration with clients and solution specialists, and monitoring delivery schedules, risks and project milestones.

      I also contributed to project proposals and statements of work, ensuring that technical requirements, client expectations and delivery plans were aligned.

      This role strengthened my hands-on project management experience, combining structured planning, stakeholder communication and the coordination of technical implementations.
    areas:
      - "Project Management"
      - "Cloud Migration"
      - "Microsoft 365"
      - "Azure"
      - "Stakeholder Management"
      - "Project Delivery"
    story: expert
  - role: "Managing Director / Project Manager"
    organization: "Arhivio Data"
    period: "July 2016 – June 2018"
    location: "Bucharest, Romania"
    text: |-
      I combined company management responsibilities with hands-on project management for software development initiatives, particularly content management and e-commerce solutions.

      My work included coordinating business and technical requirements, organizing system analysis and design activities, defining project stages and deliverables, and managing collaboration with technical specialists and external consultants.

      I was responsible for planning project schedules, assigning responsibilities, monitoring progress and managing dependencies, using Agile and Waterfall approaches according to project needs.

      The role also involved client relationships, identifying business opportunities and exploring European funding options for IT projects.
    areas:
      - "IT Project Management"
      - "Business Analysis"
      - "Software Development"
      - "CMS & E-commerce"
      - "Team Coordination"
      - "Client Relations"
    story: arhivio
  - role: "Managing Director / Director"
    organization: "Teletrans SA"
    period: "May 2011 – July 2016"
    location: "Bucharest, Romania"
    text: |-
      Teletrans, a subsidiary of Romania's national electricity transmission operator, provided telecommunications, IT and process control solutions for the energy sector.

      My responsibilities included executive management of the company and, subsequently, the coordination of strategy, programmes, communications and international relations.

      The role involved overseeing IT and telecommunications investments, coordinating project portfolios and aligning technological initiatives with organizational priorities.

      Representative initiatives included SAP HCM and CRM implementations, SCADA modernization, fibre-optic infrastructure, data centre development and disaster recovery solutions.

      I was also involved in exploring European funding opportunities for technology and infrastructure projects, within the regulatory and organizational constraints applicable at the time.
    areas:
      - "Executive Leadership"
      - "IT Strategy"
      - "Project Governance"
      - "Telecommunications"
      - "Energy Sector"
    story: teletrans
